; Mempercepat PHP di Docker: hasil kompilasi file disimpan di memori, tidak dibaca ulang dari disk di tiap request.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Tetap memeriksa perubahan file tiap 2 detik, supaya hasil edit kode dan tampilan langsung terlihat
opcache.validate_timestamps=1
opcache.revalidate_freq=2
; Menyimpan lokasi file lebih lama (membantu di folder yang lambat dibaca)
realpath_cache_size=4096K
realpath_cache_ttl=600